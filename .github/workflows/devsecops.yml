# ──────────────────────────────────────────────────
# SecPipeline DevSecOps CI/CD 파이프라인
# 5-Gate 보안 검사 + 빌드 + (향후) 배포 + DAST
#
# 학술 근거: Fu et al. (2024), "AI for DevSecOps"
# 이 파이프라인은 논문의 5단계 프레임워크
# (Code Commit → Build → Test → Deploy → Monitor)를 구현한다.
# ──────────────────────────────────────────────────

name: SecPipeline DevSecOps

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # 수동 재학습 트리거 (MLOps): 데이터/피처 변경 후 v2 모델 생성용
  workflow_dispatch:
    inputs:
      data_version:
        description: "데이터/모델 버전 태그 (v2면 추가 공격 변형 포함)"
        default: "v2"
        type: string

jobs:
  # ── Gate 1: Secret Scan (Gitleaks) ──────────────
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Gate 2: Dependency Scan (pip-audit) ─────────
  dependency-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install pip-audit
          pip-audit -r requirements.txt --format json --output dep-scan.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-scan
          path: dep-scan.json

  # ── Gate 3: SAST (Semgrep + Bandit) ─────────────
  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install semgrep bandit
          semgrep scan --config auto --config .semgrep/ app/ --json --output semgrep.json || true
          bandit -r app/ -f json -o bandit.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sast-results
          path: |
            semgrep.json
            bandit.json

  # ── Unit Test (pytest) ──────────────────────────
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install -r requirements.txt
          python -m pytest tests/ -v --junitxml=test-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: test-results.xml


  # ── MLSecOps: 보안 ML 학습 + 품질 게이트 ─────────
  # 합성 데이터 생성 → 학습(MLflow 로깅) → macro-F1 품질 게이트 → 모델 artifact 업로드.
  # 기존 5-Gate 보안 잡은 그대로 두고 ML 단계만 추가한다(DevSecOps + MLOps 통합).
  ml-train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      # push/PR는 v1, 수동 재학습(workflow_dispatch)은 입력값(기본 v2)
      - name: Seed synthetic request data
        run: python scripts/seed_attacks.py --version "${{ github.event.inputs.data_version || 'v1' }}"
      - name: Train models + MLflow logging
        run: python -m app.ml.train --version "${{ github.event.inputs.data_version || 'v1' }}"
      - name: Model quality gate (macro-F1 >= 0.80)
        run: python scripts/eval_gate.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ml-model
          path: |
            models/attack_clf.pkl
            models/metrics.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mlflow-runs
          path: mlruns/

  # ── Gate 4: Build + Container Scan (Trivy) ──────
  build-and-scan:
    runs-on: ubuntu-latest
    needs: [secret-scan, dependency-scan, sast, unit-test, ml-train]
    steps:
      - uses: actions/checkout@v4
      # 게이트를 통과한 CI 학습 모델을 내려받아 이미지에 포함
      - uses: actions/download-artifact@v4
        with:
          name: ml-model
          path: models
      - run: docker build -t studylog:${{ github.sha }} .
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: studylog:${{ github.sha }}
          format: json
          output: trivy.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-results
          path: trivy.json

  # ── Gate 5: Dockerfile Lint (hadolint) ──────────
  dockerfile-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.3.0
        with:
          dockerfile: Dockerfile

  # ── Deploy: Render Webhook 배포 ─────────────────
  deploy:
    runs-on: ubuntu-latest
    needs: [unit-test, build-and-scan, dockerfile-lint]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Trigger Render Deploy
        run: curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"

  # ── Gate 7: DAST (OWASP ZAP) - 운영 환경 동적 스캔 ──
  dast:
    runs-on: ubuntu-latest
    needs: deploy
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: 'https://secpipeline.onrender.com'
          fail_action: false