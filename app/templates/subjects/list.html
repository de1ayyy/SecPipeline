{% extends "base.html" %}
{% block title %}과목 관리{% endblock %}
{% block content %}
<div style="max-width: 600px; margin: 0 auto;">
    <h2 style="color:var(--brand-700);">📂 과목 관리</h2>
    
    <div class="card" style="margin-bottom: 30px;">
        <form method="post" action="{{ url_for('subjects.create_subject') }}" style="display:flex; gap:10px;">
            <input class="form-control" name="name" placeholder="새로운 과목 이름을 입력하세요" style="margin-bottom:0;" required>
            <button type="submit" class="btn btn-primary" style="white-space:nowrap;">추가하기</button>
        </form>
    </div>

    {% if not subjects %}
    <div class="empty-state card">
        <h4 style="margin:0;">등록된 과목이 없습니다.</h4>
    </div>
    {% else %}
    <div class="card" style="padding:10px 20px;">
        {% for s in subjects %}
        <div style="display:flex; justify-content:space-between; align-items:center; padding:12px 0; border-bottom:1px solid var(--line);">
            <div style="display:flex; align-items:center; gap:10px;">
                <span style="display:inline-block; width:12px; height:12px; border-radius:50%; background:var(--brand-500);"></span>
                <strong style="font-size:1.1rem; color:var(--ink-900);">{{ s['name'] }}</strong>
            </div>
            <form method="post" action="{{ url_for('subjects.delete_subject', subject_id=s['id']) }}" style="margin:0;">
                <button type="submit" class="btn btn-sm btn-danger" onclick="return confirm('이 과목을 삭제하시겠습니까?')">삭제</button>
            </form>
        </div>
        {% endfor %}
    </div>
    {% endif %}
</div>
{% endblock %}
