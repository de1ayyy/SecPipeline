{% extends "base.html" %}
{% block title %}회원가입{% endblock %}
{% block content %}
<div class="card" style="max-width: 400px; margin: 40px auto;">
    <h2 style="text-align: center; color: var(--brand-500); margin-top:0;">회원가입</h2>
    
    {% if error %}
        <div class="toast toast-error show" style="position:static; transform:none; margin-bottom:15px; text-align:center;">
            {{ error }}
        </div>
    {% endif %}

    <form method="post">
        <label style="font-weight:600; margin-bottom:8px; display:block;">사용자명</label>
        <input class="form-control" name="username" placeholder="사용할 아이디" required>
        
        <label style="font-weight:600; margin-bottom:8px; display:block;">비밀번호</label>
        <input class="form-control" id="pwd" name="password" type="password" placeholder="비밀번호" required oninput="checkStrength()">
        
        <div style="margin-bottom:15px; font-size:0.8rem;">
            <span>비밀번호 강도: </span><span id="strength-text" style="font-weight:bold; color:var(--ink-500);">입력해주세요</span>
            <div style="width:100%; height:4px; background:var(--line); margin-top:4px; border-radius:2px;">
                <div id="strength-bar" style="width:0%; height:100%; border-radius:2px; transition:all 0.3s;"></div>
            </div>
        </div>

        <button class="btn btn-primary btn-block" type="submit">가입완료</button>
    </form>
    
    <p style="text-align: center; margin-top: 20px; font-size: 0.9rem; color: var(--ink-500);">
        이미 계정이 있으신가요? <a href="{{ url_for('auth.login') }}" style="color: var(--brand-500); font-weight:600; text-decoration:none;">로그인</a>
    </p>
</div>

<script>
function checkStrength() {
    const val = document.getElementById('pwd').value;
    const bar = document.getElementById('strength-bar');
    const text = document.getElementById('strength-text');
    let strength = 0;
    
    if(val.length > 5) strength += 1;
    if(val.length > 8) strength += 1;
    if(/[A-Z]/.test(val)) strength += 1;
    if(/[0-9]/.test(val)) strength += 1;
    if(/[^A-Za-z0-9]/.test(val)) strength += 1;

    if(val.length === 0) { text.innerText = "입력해주세요"; text.style.color = "var(--ink-500)"; bar.style.width = "0%"; return; }
    
    if(strength <= 2) { text.innerText = "약함"; text.style.color = "var(--danger-500)"; bar.style.width = "33%"; bar.style.backgroundColor = "var(--danger-500)"; }
    else if(strength <= 4) { text.innerText = "보통"; text.style.color = "var(--warn-500)"; bar.style.width = "66%"; bar.style.backgroundColor = "var(--warn-500)"; }
    else { text.innerText = "강함"; text.style.color = "var(--accent-500)"; bar.style.width = "100%"; bar.style.backgroundColor = "var(--accent-500)"; }
}
</script>
{% endblock %}
