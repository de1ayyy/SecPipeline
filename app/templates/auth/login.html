{% extends "base.html" %}
{% block title %}로그인{% endblock %}
{% block content %}
<div class="card" style="max-width: 400px; margin: 40px auto;">
    <h2 style="text-align: center; color: var(--brand-500); margin-top:0;">로그인</h2>
    
    {% if error %}
        <div class="toast toast-error show" style="position:static; transform:none; margin-bottom:15px; text-align:center;">
            {{ error }}
        </div>
    {% endif %}

    <form method="post">
        <label style="font-weight:600; margin-bottom:8px; display:block;">사용자명</label>
        <input class="form-control" name="username" placeholder="아이디를 입력하세요" required>
        
        <label style="font-weight:600; margin-bottom:8px; display:block;">비밀번호</label>
        <input class="form-control" name="password" type="password" placeholder="비밀번호를 입력하세요" required>
        
        <button class="btn btn-primary btn-block" type="submit" style="margin-top: 10px;">로그인</button>
    </form>
    
    <p style="text-align: center; margin-top: 20px; font-size: 0.9rem; color: var(--ink-500);">
        계정이 없으신가요? <a href="{{ url_for('auth.register') }}" style="color: var(--brand-500); font-weight:600; text-decoration:none;">회원가입</a>
    </p>
</div>
{% endblock %}
